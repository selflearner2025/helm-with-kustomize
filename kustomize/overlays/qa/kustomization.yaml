# kustomize/overlays/qa/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: single-bpmn-ns                    # ← same namespace

helmCharts:
  - name: claims-chart
    repo: http://nexus-nexus-repository-manager.default.svc.cluster.local:8081/repository/helm-hosted/
    version: 0.1.0
    releaseName: claims-qa            # ← different releaseName
    valuesFile: values-claims-qa.yaml

  - name: job-chart
    repo: http://nexus-nexus-repository-manager.default.svc.cluster.local:8081/repository/helm-hosted/
    version: 0.5.0
    releaseName: job-qa
    valuesFile: values-job-qa.yaml