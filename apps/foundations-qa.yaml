apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: foundations-qa
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default

  source:
    repoURL: https://github.com/selflearner2025/helm-with-kustomize.git
    targetRevision: test
    path: kustomize/overlays/qa         # ← points to qa overlay

  destination:
    server: https://kubernetes.default.svc
    namespace: single-bpmn-ns                  # ← same shared namespace

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true